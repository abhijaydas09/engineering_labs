<p>item-form works!</p>
<div class="form-container">
  <h2>Add New Post</h2>
  <form [formGroup]="itemForm" (ngSubmit)="addItem()">
    <div class="form-group">
      <label for="title">Title:</label>
      <input id="title" formControlName="title" placeholder="Enter post title">
      <div class="error-message" *ngIf="itemForm.get('title')?.invalid && itemForm.get('title')?.touched">
        Title is required.
      </div>
    </div>

    <div class="form-group">
      <label for="body">Content:</label>
      <textarea id="body" formControlName="body" placeholder="Enter post content" rows="4"></textarea>
      <div class="error-message" *ngIf="itemForm.get('body')?.invalid && itemForm.get('body')?.touched">
        Content is required.
      </div>
    </div>

    <button type="submit" [disabled]="itemForm.invalid">Add Post</button>
  </form>

  <div class="added-items">
    <h3>Added Posts</h3>
    <ul>
      <li *ngFor="let item of items">
        <strong>{{ item.title }}</strong>
        <p>{{ item.body }}</p>
      </li>
    </ul>
    <p *ngIf="items.length === 0">No posts added yet</p>
  </div>
</div>
