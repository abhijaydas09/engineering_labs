<div class="container">
  <h2>Posts from API</h2>

  <div *ngIf="loading" class="loading">Loading...</div>

  <div *ngIf="error" class="error">
    {{ error }}
  </div>

  <ul class="item-list" *ngIf="!loading && !error">
    <li *ngFor="let item of items" class="item-card">
      <h3>{{ item.title }}</h3>
      <p>{{ item.body }}</p>
    </li>
  </ul>
</div>
